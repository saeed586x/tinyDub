name: tinyDub Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed." }

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed." }

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build\Release\tinyDub.exe"
          if (!(Test-Path $exe)) { throw "Missing executable: $exe" }
          Get-Item $exe | Select-Object FullName,Length

      - name: Win32 UI smoke test
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\tests\ui-smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw "Win32 UI smoke test failed." }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\Release\tinyDub.exe" "dist\tinyDub.exe"
          $hash = (Get-FileHash "dist\tinyDub.exe" -Algorithm SHA256).Hash
          "$hash  tinyDub.exe" | Set-Content "dist\SHA256SUMS.txt"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyDub-windows-x64
          path: dist/
          if-no-files-found: error
